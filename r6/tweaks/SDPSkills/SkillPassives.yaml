# Generated from the installed game TweakDB inventory (SDPFIND in CET scripting.log).
# Every attribute-reading stat modifier below reads a skill-derived proxy instead.
# The five *Available proxies equal 3 + (skillLevel - 1) * 17 / 59.
# Attributes remain computed for perk and dialogue checks, but no stat modifier
# listed here reads Strength, Reflexes, TechnicalAbility, Intelligence, or Cool.
Character.PlayerCyberwareSystem:
  statModifiers:
    - !append
      $type: ConstantStatModifier
      modifierType: Additive
      statType: BaseStats.StrengthAvailable
      value: 2.711864407
    - !append
      $type: ConstantStatModifier
      modifierType: Additive
      statType: BaseStats.ReflexesAvailable
      value: 2.711864407
    - !append
      $type: ConstantStatModifier
      modifierType: Additive
      statType: BaseStats.TechnicalAbilityAvailable
      value: 2.711864407
    - !append
      $type: ConstantStatModifier
      modifierType: Additive
      statType: BaseStats.IntelligenceAvailable
      value: 2.711864407
    - !append
      $type: ConstantStatModifier
      modifierType: Additive
      statType: BaseStats.CoolAvailable
      value: 2.711864407

# Reuse the original player modifiers so their reference object and
# other semantics remain intact; the constants above restore skill 1 = 3.
Character.PlayerCyberwareSystem_inline0.refStat: BaseStats.StrengthSkill
Character.PlayerCyberwareSystem_inline0.value: 0.288135593
Character.PlayerCyberwareSystem_inline2.refStat: BaseStats.ReflexesSkill
Character.PlayerCyberwareSystem_inline2.value: 0.288135593
Character.PlayerCyberwareSystem_inline6.refStat: BaseStats.TechnicalAbilitySkill
Character.PlayerCyberwareSystem_inline6.value: 0.288135593
Character.PlayerCyberwareSystem_inline4.refStat: BaseStats.IntelligenceSkill
Character.PlayerCyberwareSystem_inline4.value: 0.288135593
Character.PlayerCyberwareSystem_inline8.refStat: BaseStats.CoolSkill
Character.PlayerCyberwareSystem_inline8.value: 0.288135593

