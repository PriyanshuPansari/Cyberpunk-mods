# Dedicated processor socket, three training bays, and one reserved Relic bay.
SkillDrivenProgression.ProcessorEquipSlot:
  $type: EquipSlot
  visibleWhenLocked: false

SkillDrivenProgression.ShardSlot$(index):
  $instances:
    - { index: 1 }
    - { index: 2 }
    - { index: 3 }
  $type: gamedataAttachmentSlot_Record
  entitySlotName: SDPShardSlot$(index)
  localizedName: ShardSlot
  customOffset: { x: 0, y: 0, z: 0 }
  tagsForActiveItemCycling: []

SkillDrivenProgression.ShardElement$(index):
  $instances:
    - { index: 1 }
    - { index: 2 }
    - { index: 3 }
  $type: ItemBlueprintElement
  slot: SkillDrivenProgression.ShardSlot$(index)

SkillDrivenProgression.RelicSlot:
  $type: gamedataAttachmentSlot_Record
  entitySlotName: SDPRelicSlot
  localizedName: Relic
  customOffset: { x: 0, y: 0, z: 0 }
  tagsForActiveItemCycling: []

SkillDrivenProgression.RelicElement:
  $type: ItemBlueprintElement
  slot: SkillDrivenProgression.RelicSlot

SkillDrivenProgression.ProcessorRoot:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.GenericItemRoot
  childElements:
    - SkillDrivenProgression.ShardElement1
    - SkillDrivenProgression.ShardElement2
    - SkillDrivenProgression.ShardElement3
    - SkillDrivenProgression.RelicElement

SkillDrivenProgression.ProcessorBlueprint:
  $type: ItemBlueprint
  rootElement: SkillDrivenProgression.ProcessorRoot

SkillDrivenProgression.NeuralProcessor:
  $base: Items.AdvancedBiomonitorCommon
  quality: Quality.LegendaryPlusPlus
  nextUpgradeItem: None
  equipArea: EquipmentArea.EyesCW
  cyberwareType: CyberwareSockets
  blueprint: SkillDrivenProgression.ProcessorBlueprint
  variants: [Variants.Humanity0Cost]
  OnEquip: []
  tags: [Cyberware, HideInBackpackUI, SkillDrivenProgression.Processor]
  displayName: LocKey#sdp_neural_processor_name
  localizedDescription: LocKey#sdp_neural_processor_description
  icon:
    atlasResourcePath: base\gameplay\gui\common\icons\items\item_icons7.inkatlas
    atlasPartName: cwf_armscyberwareshared2

SkillDrivenProgression.DeadeyeTier1Shard:
  $base: Items.KiroshiOpticsFragment5
  itemType: ItemType.Prt_Program
  shardType: SDPDeadeye
  quality: Quality.Common
  # Shard upgrades are owned by the processor action, not the game's native
  # cyberware upgrade chain. Recording must never trigger a free upgrade.
  nextUpgradeItem: None
  icon:
    atlasResourcePath: base\gameplay\gui\quests\assets\q005_heist_plan.inkatlas
    atlasPartName: chip
  OnAttach:
    - $type: GameplayLogicPackage
      UIData:
        $type: GameplayLogicPackageUIData
        localizedDescription: LocKey#sdp_deadeye_tier1_training
  OnEquip: []
  placementSlots:
    - SkillDrivenProgression.ShardSlot1
    - SkillDrivenProgression.ShardSlot2
    - SkillDrivenProgression.ShardSlot3
  tags: [itemPart, Fragment, SkillDrivenProgression.Shard]
  displayName: LocKey#sdp_deadeye_tier1_name
  localizedDescription: LocKey#sdp_deadeye_tier1_description

SkillDrivenProgression.DeadeyeTier1PlusShard:
  $base: SkillDrivenProgression.DeadeyeTier1Shard
  quality: Quality.CommonPlus
  nextUpgradeItem: None
  icon:
    atlasResourcePath: base\gameplay\gui\quests\assets\q005_heist_plan.inkatlas
    atlasPartName: chip
  OnAttach:
    - $type: GameplayLogicPackage
      UIData:
        $type: GameplayLogicPackageUIData
        localizedDescription: LocKey#sdp_deadeye_tier1plus_training
  displayName: LocKey#sdp_deadeye_tier1plus_name
  localizedDescription: LocKey#sdp_deadeye_tier1plus_description

