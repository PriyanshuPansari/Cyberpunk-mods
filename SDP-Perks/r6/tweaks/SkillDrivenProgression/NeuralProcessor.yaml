# A physical representation of the story Relic. Its quest mechanics remain
# owned by the game; this part only occupies the processor's dedicated bay.
SkillDrivenProgression.RelicModule:
  $base: Items.KiroshiOpticsFragment5
  itemType: ItemType.Prt_Program
  shardType: SDPRelic
  quality: Quality.Common
  nextUpgradeItem: None
  icon:
    atlasResourcePath: base\gameplay\gui\quests\assets\q005_heist_plan.inkatlas
    atlasPartName: chip
  OnAttach: []
  OnEquip: []
  placementSlots: [SkillDrivenProgression.RelicSlot]
  tags: [itemPart, Fragment, SkipActivityLog, SkillDrivenProgression.Relic]
  displayName: LocKey#sdp_relic_module_name
  localizedDescription: LocKey#sdp_relic_module_description
