# Build 12 primitives. Each carries the gameplay tags the game's scripts react to:
# LocomotionMalfunction (AI cannot-move condition), JamWeapon/WeaponJam plus our
# own SDPJam (AIWeapon.Fire is blocked while it is active), Deaf/CommsNoiseJam
# (hearing off, no calls for help, no tracked accuracy) and CyberwareMalfunction
# (no NPC counter-hacking, cyberware-malfunction damage bonuses).
SkillDrivenProgression.PrototypeImmobilize2:
  $type: gamedataStatusEffect_Record
  duration: SkillDrivenProgression.PrimitiveDuration2
  statusEffectType: BaseStatusEffectTypes.Misc
